# Isolated SearXNG settings for the brochure-tg test environment.
# Only overrides what brochure discovery needs; everything else inherits the
# image defaults via use_default_settings.
use_default_settings: true

server:
  secret_key: "local-brochure-tg-test-only"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  # The discovery worker calls /search?format=json, so JSON must be allowed.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-TW"

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
