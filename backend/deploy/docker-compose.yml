# Single-host STA backend stack.
#
#   cd deploy
#   cp .env.example .env
#   docker compose up -d --build            # HTTP extraction transport
#   docker compose --profile rabbitmq up -d --build   # + RabbitMQ transport
#
# One-shot jobs:
#   docker compose run --rm migrate
#   docker compose run --rm api bootstrap-admin -username <existing-user>
#   docker compose --profile maintenance run --rm annual-maintenance -academic-year 114
#
# `migrate` runs automatically as an init dependency of `api`.

name: sta-backend

x-app-image: &app-image
  image: sta-backend:local
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: [.env]

services:
  postgres:
    image: postgres:16-alpine
    # pg_stat_statements needs to be loaded at startup (shared_preload_libraries),
    # not just CREATE EXTENSION'd — it hooks the query executor, which can't be
    # attached to an already-running postmaster. track=all also counts queries
    # run inside PL/pgSQL functions/triggers, not just top-level statements.
    command: postgres -c max_connections=120 -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sta}
      # Required, not defaulted (matches STA_REDIS_PASSWORD below): a
      # silently-applied "sta" fallback here would mean any deploy that
      # forgot to set this ends up with a guessable Postgres password
      # instead of failing to start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${STA_COMPOSE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sta-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sta-minio-secret}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${STA_COMPOSE_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${STA_COMPOSE_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-sta-minio-root}:${MINIO_ROOT_PASSWORD:-sta-minio-secret}@minio:9000
      MINIO_BUCKET: ${STA_OBJECT_STORAGE_BUCKET:-sta-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc mb --ignore-existing "local/$$MINIO_BUCKET" && mc anonymous set none "local/$$MINIO_BUCKET"
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-sta}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${STA_COMPOSE_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${STA_COMPOSE_RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sta-local-meili-master-key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    volumes:
      - meili-data:/meili_data
    ports:
      - "127.0.0.1:${STA_COMPOSE_MEILI_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${STA_REDIS_PASSWORD:?STA_REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      STA_REDIS_PASSWORD: ${STA_REDIS_PASSWORD:?STA_REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$STA_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Monitoring stack (Grafana + Prometheus) ---
  # None of these publish a host port; Grafana is the only one reachable from
  # outside, and only via the caddy reverse proxy below (see
  # STA_GRAFANA_HOSTNAME), never directly.

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-sta}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-sta}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${STA_REDIS_PASSWORD:?STA_REDIS_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor
      - postgres-exporter
      - redis-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SERVER_ROOT_URL: "https://${STA_GRAFANA_HOSTNAME}/"
      # Grafana is only served through Caddy over HTTPS. Keep its session
      # cookie HTTPS-only and emit HSTS; SameSite=Lax preserves normal
      # top-level navigation through the external auth proxy.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS: "31536000"
      # Reduce transient SQLITE_BUSY failures without serializing Grafana's
      # startup migrations onto a single connection.
      GF_DATABASE_WAL: "true"
      GF_DATABASE_QUERY_RETRIES: "5"
      GF_DATABASE_TRANSACTION_RETRIES: "10"
      # No password login of its own: Caddy's forward_auth (see Caddyfile)
      # only lets a request through once the API confirms the caller is
      # already a logged-in STA admin, and hands Grafana that account's
      # username via X-WEBAUTH-USER. Grafana auto-provisions a matching local
      # user on first sight and grants it Grafana's Admin role — reasonable
      # here since forward_auth already means every arrival is an STA admin.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_SYNC_TTL: "15"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/dashboards/home-dashboard.json"
      # No GF_AUTH_PROXY_WHITELIST: that pins trusted source IPs, but
      # Grafana's container has no published host port at all, so the only
      # thing that can ever reach it is Caddy over the internal compose
      # network — trusting whichever IP that happens to be doesn't add any
      # real restriction, and a wrong static IP here would just as easily
      # break it outright when the network assigns a different one.
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/sta.yml:ro
      - ./monitoring/home-dashboard.json:/etc/grafana/dashboards/home-dashboard.json:ro
      - ./monitoring/provisioned-dashboards:/etc/grafana/provisioned-dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${STA_COMPOSE_MAILHOG_UI_PORT:-8025}:8025"

  postfix:
    image: sta-postfix:local
    build:
      context: ./postfix
    ports:
      - "25:25"
    environment:
      MAIL_HOSTNAME: ${STA_MAIL_HOSTNAME:-mail.sta-tw.org}
      MAIL_DOMAIN: ${STA_MAIL_DOMAIN:-sta-tw.org}
      STA_ACCOUNT_APPLICATION_MAIL_TOKEN: ${STA_ACCOUNT_APPLICATION_MAIL_TOKEN:-}
      # For the pgsql local_recipient_maps/transport_maps lookups against
      # mail_routes — same credentials the api/postgres-exporter services
      # already use, just handed to Postfix too.
      STA_POSTGRES_USER: ${POSTGRES_USER:-sta}
      STA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      STA_POSTGRES_DB: ${POSTGRES_DB:-sta}
    # The host's default resolver is Tailscale's MagicDNS (100.100.100.100),
    # which has been observed to intermittently SERVFAIL on real *.edu.tw
    # zones (e.g. nchu.edu.tw) — Postfix needs reliable MX lookups to deliver
    # the registration/verification mail this whole flow depends on.
    #
    # Resolved via dns-doh (DNS-over-HTTPS to Cloudflare) instead of talking
    # plaintext UDP/53 to a public resolver directly: every MX/A lookup this
    # MTA makes for an inbound sender's or outbound recipient's domain is
    # otherwise visible in cleartext to anything on the network path, which
    # for a mail server is a steady stream of externally-influenced lookups
    # (a spammer's From: domain, a bounce target, ...) — exactly the pattern
    # a campus/network SOC's DNS monitoring flags as suspicious on a host
    # it already has reason to watch. DoH keeps the query content opaque to
    # that vantage point; see the dns-doh service below.
    dns:
      - 172.16.255.53
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      dns-doh:
        condition: service_started
    volumes:
      - postfix-tls:/etc/postfix/tls
      - postfix-dkim:/etc/opendkim/keys
      # A message still queued (e.g. deferred, retrying MX lookup) must
      # survive a container rebuild/restart — an MTA that drops in-flight
      # mail on redeploy isn't acceptable.
      - postfix-spool:/var/spool/postfix
      # Read-only: Caddy's ACME storage. The mail hostname's Let's Encrypt
      # cert (obtained via the placeholder site block in the Caddyfile) is
      # copied out of here on startup instead of using a self-signed cert, so
      # STARTTLS to this relay passes normal certificate verification.
      - caddy-data:/caddy-data:ro
    networks:
      default:
        # So other containers can reach it by the same name its cert is
        # issued for (STA_SMTP_HOST=mail.sta-tw.org) — TLS hostname
        # verification needs the connection name to match the cert.
        aliases:
          - ${STA_MAIL_HOSTNAME:-mail.sta-tw.org}
    restart: unless-stopped

  # DNS-over-HTTPS resolver for postfix (see the comment on its `dns:` key).
  # Must live on the `default` network, not a second one: Docker's embedded
  # per-container DNS proxy (127.0.0.11, which every container on a
  # user-defined network gets regardless of the `dns:` override) only
  # forwards to an external nameserver reachable via the container's
  # *primary* network — confirmed by testing: this same setup on a separate
  # `postfix-dns` network had a fully open, reachable UDP/TCP 53 (verified
  # with nc from inside postfix's own network namespace) yet 127.0.0.11
  # still timed out forwarding every query. Fixed IP (172.16.255.53, picked
  # well outside Docker's dynamic allocation range to avoid ever colliding
  # with an auto-assigned container address) needs `default`'s subnet
  # pinned below to match its real, already-in-place value exactly — so
  # this never forces Compose to recreate the network other services sit on.
  dns-doh:
    # Pinned: `proxy-dns` (plain-DNS-in, DoH-out) was removed from cloudflared
    # upstream in 2026.2.0 with no direct replacement flag — this is the last
    # tag confirmed to still have it. Revisit if Cloudflare stops publishing
    # it; dnscrypt-proxy is the fallback if this tag becomes unavailable.
    image: cloudflare/cloudflared:2025.9.1
    command:
      - proxy-dns
      - --address=0.0.0.0
      - --port=53
      - --upstream=https://1.1.1.1/dns-query
      - --upstream=https://1.0.0.1/dns-query
    networks:
      default:
        ipv4_address: 172.16.255.53
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:ro
    ports:
      - "127.0.0.1:${STA_COMPOSE_SEARXNG_PORT:-8888}:8080"

  migrate:
    <<: *app-image
    command: ["migrate", "-dir", "migrations", "-include-telegram"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-image
    command: ["api"]
    ports:
      - "127.0.0.1:${STA_COMPOSE_API_PORT:-8080}:8080"
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "/readyz"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  chat-worker:
    <<: *app-image
    command: ["chat-worker"]
    environment:
      STA_HEALTHCHECK_URL: http://127.0.0.1:9090/healthz
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    <<: *app-image
    command: ["notification-worker"]
    # Multiple workers claim disjoint outbox rows with FOR UPDATE SKIP LOCKED.
    deploy:
      replicas: 3
    environment:
      STA_HEALTHCHECK_URL: http://127.0.0.1:9090/healthz
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
      postfix:
        condition: service_started
    restart: unless-stopped

  support-worker:
    <<: *app-image
    command: ["support-worker"]
    environment:
      STA_HEALTHCHECK_URL: http://127.0.0.1:9090/healthz
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ingestion-worker:
    <<: *app-image
    profiles: ["rabbitmq"]
    command: ["ingestion-worker"]
    environment:
      STA_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-sta}:${RABBITMQ_DEFAULT_PASS:-sta}@rabbitmq:5672/
      STA_HEALTHCHECK_URL: http://127.0.0.1:9090/healthz
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  python-worker:
    image: sta-worker:local
    build:
      context: ../worker
      dockerfile: Dockerfile
    command: ["worker.sta_worker.main"]
    env_file: [.env]
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  discovery-worker:
    image: sta-worker:local
    build:
      context: ../worker
      dockerfile: Dockerfile
    command: ["worker.sta_worker.discovery"]
    env_file: [.env]
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  annual-maintenance:
    <<: *app-image
    profiles: ["maintenance"]
    command: ["annual-maintenance"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: builds the Next.js static export and publishes it into the
  # frontend-static volume via an atomic symlink swap (see
  # ../frontend/Dockerfile). Re-run this alone for a frontend-only deploy —
  # it never touches the caddy container, so there's no port gap.
  #
  #   docker compose build frontend-build && docker compose run --rm frontend-build
  frontend-build:
    image: sta-frontend-build:local
    build:
      context: ../..
      dockerfile: backend/deploy/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${STA_FRONTEND_API_BASE_URL:-}
    volumes:
      - frontend-static:/out
    environment:
      STA_CLOUDFLARE_API_TOKEN: ${STA_CLOUDFLARE_API_TOKEN:-}
      STA_CLOUDFLARE_ZONE_ID: ${STA_CLOUDFLARE_ZONE_ID:-}
    restart: "no"

  caddy:
    image: sta-caddy:local
    build:
      context: ../..
      dockerfile: backend/deploy/caddy/Dockerfile
    environment:
      STA_DOMAIN: ${STA_DOMAIN:-:80}
      STA_ACME_EMAIL: ${STA_ACME_EMAIL:-admin@sta-tw.org}
      STA_MAIL_HOSTNAME: ${STA_MAIL_HOSTNAME:-:8081}
      STA_OBJECT_STORAGE_PUBLIC_HOSTNAME: ${STA_OBJECT_STORAGE_PUBLIC_HOSTNAME:-:8082}
      STA_GRAFANA_HOSTNAME: ${STA_GRAFANA_HOSTNAME:-:8083}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - frontend-static:/srv/frontend:ro
      # Bind-mounted (not baked into the image) so a Caddyfile-only change
      # can be applied with `caddy reload` — zero-downtime, no container
      # recreate. scp the file here, then:
      #   docker exec sta-backend-caddy-1 caddy reload --config /etc/caddy/Caddyfile
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  # Pinned (not left to Compose's auto-allocation) so it never collides with
  # another project's network on this host — confirm via `docker network
  # inspect` before changing; this must match the network's actual subnet
  # exactly, or Compose will try to recreate the network (and every
  # container on it) to apply a "changed" config.
  default:
    ipam:
      config:
        - subnet: 172.16.0.0/16
          gateway: 172.16.0.1

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  clamav-signatures:
  meili-data:
  redis-data:
  prometheus-data:
  grafana-data:
  frontend-static:
  caddy-data:
  caddy-config:
  postfix-tls:
  postfix-dkim:
  postfix-spool:
