name: backend

on:
  push:
    branches: [main, "backend-**"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.0"
  GOCACHE: /tmp/sta-go-cache

jobs:
  build:
    name: build / vet / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi
      - run: go build -buildvcs=false ./...
      - run: go vet ./...
      - name: openapi.json is in sync with the routes
        run: |
          python3 docs/openapi/generate.py
          git diff --exit-code -- docs/openapi.json internal/httpapi/openapi.json \
            || { echo "::error::openapi.json is stale — run python3 docs/openapi/generate.py"; exit 1; }

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  unit-test:
    name: go test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race ./...

  integration-test:
    name: go test (integration + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sta
          POSTGRES_PASSWORD: sta
          POSTGRES_DB: sta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STA_DATABASE_URL: postgres://sta:sta@localhost:5432/sta_test?sslmode=disable
      STA_TEST_DATABASE_URL: postgres://sta:sta@localhost:5432/sta_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: apply migrations
        run: go run ./cmd/migrate -dir migrations -include-telegram
      - name: migration checksum is stable (second run is a no-op)
        run: go run ./cmd/migrate -dir migrations -include-telegram
      - name: integration tests
        run: go test -tags integration ./...

  python:
    name: python worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r worker/requirements.txt -r worker/requirements-dev.txt
      - run: ruff check worker
      - run: python -m unittest discover -s worker/tests -v
